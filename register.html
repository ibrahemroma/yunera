<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل حساب جديد | YUNÉRA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12140F; --parchment:#F4EEDF; --emerald:#233F35; --emerald-light:#375A4B;
  --gold:#C7A445; --gold-soft:#E4CD8B; --muted:#948E7B; --muted-2:#5C5949;
  --line:rgba(18,20,15,.12); --danger:#B65656; --radius:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--emerald);min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:'Cairo',sans-serif;color:var(--ink);padding:24px;
}
button{font-family:inherit;cursor:pointer;border:none}
input{font-family:inherit;font-size:.94rem;color:var(--ink)}
a{color:var(--gold-soft);text-decoration:underline}

.card{background:var(--parchment);width:min(420px,94vw);border-radius:12px;padding:38px 32px;
  box-shadow:0 30px 80px rgba(0,0,0,.3)}
.wordmark{font-family:'Aref Ruqaa',serif;font-size:1.9rem;text-align:center;color:var(--emerald)}
.tag{text-align:center;font-size:.76rem;color:var(--muted-2);letter-spacing:.1em;margin-bottom:26px}
.title{font-family:'Aref Ruqaa',serif;font-size:1.3rem;margin-bottom:6px}
.sub{font-size:.82rem;color:var(--muted);margin-bottom:22px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:.78rem;font-weight:700;color:var(--muted-2)}
.field input{padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
.btn-gold{width:100%;padding:14px;background:var(--gold);color:var(--ink);border-radius:var(--radius);
  font-weight:800;font-size:.94rem;margin-top:8px;transition:.2s}
.btn-gold:hover{background:var(--gold-soft)}
.msg{font-size:.8rem;margin-top:14px;text-align:center;min-height:16px}
.msg.err{color:var(--danger)}
.msg.ok{color:var(--emerald);font-weight:700}
.back-link{display:block;text-align:center;margin-top:20px;font-size:.82rem;color:var(--emerald)}
.hide{display:none !important}
</style>
</head>
<body>

<div class="card">
  <div class="wordmark">YUNÉRA</div>
  <div class="tag">يونيرا · أناقة من مصر</div>

  <div id="formBox">
    <div class="title">إنشاء حساب جديد</div>
    <div class="sub">سجّل بياناتك عشان نقدر نخدمك بشكل أسرع في أوردراتك الجاية</div>

    <div class="field"><label>الاسم بالكامل</label><input type="text" id="rName" placeholder="مثال: محمد أحمد"></div>
    <div class="field"><label>رقم الموبايل</label><input type="tel" id="rPhone" placeholder="01xxxxxxxxx"></div>
    <div class="field"><label>الإيميل (اختياري)</label><input type="email" id="rEmail" placeholder="example@mail.com"></div>
    <div class="field"><label>كلمة السر</label><input type="password" id="rPass" placeholder="اكتب كلمة سر"></div>
    <div class="field"><label>تأكيد كلمة السر</label><input type="password" id="rPass2" placeholder="اكتب كلمة السر تاني"></div>

    <button class="btn-gold" id="submitBtn">تسجيل الحساب</button>
    <div class="msg" id="msgBox"></div>
  </div>

  <div id="successBox" class="hide" style="text-align:center">
    <div class="title">تم تسجيل حسابك ✓</div>
    <div class="sub">تقدر دلوقتي ترجع للمتجر وتكمل تسوقك</div>
  </div>

  <a class="back-link" href="./yunera.html">رجوع للمتجر</a>
</div>

<script>
/* ⚠️ لازم يكون نفس رابط الـ /exec اللي في ملف الموقع الأساسي */
const GAS_URL = "https://script.google.com/macros/s/AKfycby-k98lCwFWEbRBjmKetU23wMEXgidZCFXV5sdZ5fwZ9bH3N_BZ0vt_hz3pcU_Z4-10/exec";
const $ = s => document.querySelector(s);

$('#submitBtn').addEventListener('click', async ()=>{
  const name = $('#rName').value.trim();
  const phone = $('#rPhone').value.trim();
  const email = $('#rEmail').value.trim();
  const pass = $('#rPass').value;
  const pass2 = $('#rPass2').value;
  const msg = $('#msgBox');

  if(!name || !phone){ msg.className='msg err'; msg.textContent='اكتب الاسم ورقم الموبايل'; return; }
  if(!/^01[0-9]{9}$/.test(phone)){ msg.className='msg err'; msg.textContent='اكتب رقم موبايل مصري صحيح'; return; }
  if(!pass || pass.length<4){ msg.className='msg err'; msg.textContent='كلمة السر لازم تكون 4 حروف/أرقام على الأقل'; return; }
  if(pass !== pass2){ msg.className='msg err'; msg.textContent='كلمتا السر مش متطابقتين'; return; }

  msg.className='msg'; msg.textContent='بيتم التسجيل…';
  $('#submitBtn').disabled = true;

  try{
    await fetch(GAS_URL, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, mode:'no-cors',
      body: JSON.stringify({ action:'registerCustomer', name, phone, email, password: pass })
    });
    $('#formBox').classList.add('hide');
    $('#successBox').classList.remove('hide');
  }catch(err){
    msg.className='msg err'; msg.textContent='حصل خطأ في الاتصال، جرب تاني';
    $('#submitBtn').disabled = false;
  }
});
</script>
</body>
</html>
